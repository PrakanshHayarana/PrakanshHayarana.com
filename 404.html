<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>404 — Page Not Found | Prakansh Hayarana</title>
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://prakanshhayarana.github.io/PrakanshHayarana.com/404.html">

<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=EB+Garamond:ital@0;1&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; min-height: 100vh;
    background: #efece4;
    display: flex; align-items: center; justify-content: center;
    font-family: 'EB Garamond', serif;
    overflow-x: hidden;
  }

  body {
    background-image:
      radial-gradient(circle at 20% 20%, rgba(90,160,180,0.05), transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(90,160,180,0.05), transparent 40%);
  }

  .paper {
    position: relative;
    width: 100%;
    max-width: 640px;
    margin: 40px 20px;
    padding: 56px 48px 48px;
    background: #f4f1ea;
    color: #2b3a42;
    box-shadow: 0 30px 70px rgba(20,40,45,0.35), 0 2px 10px rgba(20,40,45,0.2);
    border-radius: 4px;
    overflow: hidden;
    text-align: center;
  }

  .paper::before {
    content: '';
    position: absolute;
    top: -80px; right: -80px;
    width: 220px; height: 220px;
    border: 1px solid rgba(76,140,160,0.25);
    transform: rotate(20deg);
    pointer-events: none;
  }
  .paper::after {
    content: '';
    position: absolute;
    bottom: -60px; left: -60px;
    width: 160px; height: 160px;
    border: 1px solid rgba(76,140,160,0.18);
    transform: rotate(-15deg);
    pointer-events: none;
  }

  .logo-wrap { display: flex; justify-content: center; margin-bottom: 28px; }
  .logo-wrap img {
    width: 100px; height: 100px; object-fit: contain;
    filter: drop-shadow(0 6px 16px rgba(76,140,160,0.35));
  }

  .error-code {
    font-family: 'Inter', sans-serif;
    font-weight: 800;
    letter-spacing: 0.12em;
    font-size: 13px;
    color: #4c8ca0;
    text-transform: uppercase;
  }

  h1 {
    font-family: 'Inter', sans-serif;
    font-weight: 800;
    letter-spacing: -0.02em;
    font-size: 48px;
    color: #37474f;
    margin: 16px 0 0;
  }

  .letter-text {
    font-family: 'Caveat', cursive;
    font-size: 28px;
    line-height: 32px;
    color: #2b3a42;
    margin-top: 24px;
  }

  .cta {
    display: inline-flex;
    margin-top: 32px;
    padding: 12px 28px;
    border-radius: 999px;
    background: #37474f;
    color: #f4f1ea;
    text-decoration: none;
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    transition: transform 0.2s;
  }
  .cta:hover { transform: scale(1.03); background: #4c8ca0; }

  @media (max-width: 480px) {
    .paper { padding: 40px 28px 32px; }
    h1 { font-size: 36px; }
    .letter-text { font-size: 22px; line-height: 27px; }
    .logo-wrap img { width: 80px; height: 80px; }
  }
</style>
</head>
<body>

<main class="paper">
  <div class="logo-wrap">
    <img src="logo.png" alt="Prakansh Hayarana logo">
  </div>
  <span class="error-code">Error 404</span>
  <h1>Page Not Found</h1>
  <p class="letter-text">This page doesn't exist — but don't worry, the rest of my website still does.</p>
  <a class="cta" href="/PrakanshHayarana.com/">Back to Home</a>
</main>

</body>
</html>
