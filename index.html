<!-- Twitter Card -->
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Prakansh Hayarana">
<meta name="twitter:description" content="Official website of Prakansh Hayarana.">

<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=EB+Garamond:ital@0;1&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; min-height: 100vh;
    background: #efece4;
    display: flex; align-items: center; justify-content: center;
    font-family: 'EB Garamond', serif;
    overflow-x: hidden;
  }

  /* subtle paper grain texture */
  body {
    background-image:
      radial-gradient(circle at 20% 20%, rgba(90,160,180,0.05), transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(90,160,180,0.05), transparent 40%);
  }

  .paper {
    position: relative;
    width: 100%;
    max-width: 640px;
    margin: 40px 20px;
    padding: 56px 48px 48px;
    background: #f4f1ea;
    color: #2b3a42;
    box-shadow: 0 30px 70px rgba(20,40,45,0.35), 0 2px 10px rgba(20,40,45,0.2);
    border-radius: 4px;
    overflow: hidden;
  }

  /* thin geometric line accents, echoing the logo's polygon */
  .paper::before {
    content: '';
    position: absolute;
    top: -80px; right: -80px;
    width: 220px; height: 220px;
    border: 1px solid rgba(76,140,160,0.25);
    transform: rotate(20deg);
    pointer-events: none;
  }
  .paper::after {
    content: '';
    position: absolute;
    bottom: -60px; left: -60px;
    width: 160px; height: 160px;
    border: 1px solid rgba(76,140,160,0.18);
    transform: rotate(-15deg);
    pointer-events: none;
  }

  .logo-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 28px;
  }
  .logo-wrap img {
    width: 120px;
    height: 120px;
    object-fit: contain;
    filter: drop-shadow(0 6px 16px rgba(76,140,160,0.35));
  }

  .brand-name {
    text-align: center;
    font-family: 'Inter', sans-serif;
    font-weight: 800;
    letter-spacing: 0.12em;
    font-size: 15px;
    color: #37474f;
    margin-bottom: 36px;
  }

  .letter-text {
    position: relative;
    font-family: 'Caveat', cursive;
    font-size: 30px;
    line-height: 32px;
    color: #2b3a42;
  }

  .letter-text p { margin: 0 0 32px; }

  .signature {
    margin-top: 40px;
    text-align: right;
    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-size: 42px;
    color: #1f3b45;
  }

  .letter-img {
    display: block;
    max-width: 100%;
    height: auto;
    margin: 32px 0;
    border-radius: 4px;
    box-shadow: 0 10px 24px rgba(20,40,45,0.2);
  }

  @media (max-width: 480px) {
    .paper { padding: 40px 28px 32px; }
    .letter-text { font-size: 24px; line-height: 28px; }
    .signature { font-size: 34px; }
    .logo-wrap img { width: 96px; height: 96px; }
  }
</style>
</head>
<body>

<main class="paper">
  <div class="logo-wrap">
    <img src="logo.png" alt="Prakansh Hayarana logo">
  </div>
  <div class="brand-name">PRAKANSH</div>

  <img class="letter-img" src="img.jpg" alt="Prakansh Hayarana">

  <div class="letter-text">
    <p>Myself Prakansh Hayarana, and this is my website.</p>
    <p>It doesn't have a lot of content — but it still ranks at the top when you search for it on a search engine.</p>
    <p>I am a proud user of — because that's what the greatest writers once used, that's how LLMs started using it.</p>
  </div>
  <div class="signature">Prakansh</div>
</main>

</body>
</html>
